name: backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run tests
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://flow:flow@localhost:5432/flow
        run: python -m pytest -q
